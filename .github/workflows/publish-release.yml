name: Publish release

# Creates a GitHub Release for a verified build, without needing a Codespace.
# Downloads the app-mobile-debug artifact of the given build run, publishes
# the arm64 APK under two names (zhulong-<version>-arm64-debug.apk and
# mobile-arm64_v8a.apk), then re-downloads the published asset and checks
# its sha256. Only trigger this AFTER the "Verify built APK" run passes.
#
# Inputs (workflow_dispatch):
#   run_id  - the build run id (e.g. 45559805507)
#   version - versionName, e.g. 0.1.106
#   notes   - release body; use \n for newlines (interpreted with printf %b).
#             Must contain a "# 手機版" section.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run id to publish'
        required: true
        type: string
      version:
        description: 'Version, e.g. 0.1.106'
        required: true
        type: string
      notes:
        description: 'Release body (use \n for newlines; must contain a # 手機版 section)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fongmi
        uses: actions/checkout@v4
        with:
          ref: fongmi
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk /tmp/release
          gh run download "$RUN_ID" -n app-mobile-debug -D /tmp/apk --repo lvsehuiyicm/TV
          echo "--- artifact contents ---"
          find /tmp/apk -type f | sort

      - name: Prepare release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APK=$(find /tmp/apk -name '*.apk' | grep -i arm64 | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::no arm64 APK found in artifact"
            find /tmp/apk -name '*.apk'
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          cp "$APK" "/tmp/release/zhulong-${VERSION}-arm64-debug.apk"
          cp "$APK" "/tmp/release/mobile-arm64_v8a.apk"
          echo "--- assets + sha256 ---"
          ls -la /tmp/release/
          sha256sum /tmp/release/*.apk
          echo "ARTIFACT_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Get build commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/lvsehuiyicm/TV/actions/runs/$RUN_ID" --jq .head_sha)
          echo "HEAD_SHA=$SHA" >> "$GITHUB_ENV"
          echo "build commit: $SHA"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          printf '%b' "$NOTES" > /tmp/release/body.md
          echo "--- release body ---"
          cat /tmp/release/body.md
          gh release create "v${VERSION}" --repo lvsehuiyicm/TV \
            --target "$HEAD_SHA" \
            --title "${VERSION}" \
            --notes-file /tmp/release/body.md \
            "/tmp/release/zhulong-${VERSION}-arm64-debug.apk" \
            "/tmp/release/mobile-arm64_v8a.apk"
          echo "release v${VERSION} created"

      - name: Verify release + re-download published asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "--- release as seen via API ---"
        gh release view "v${VERSION}" --repo lvsehuiyicm/TV --json tagName,targetCommitish,assets,body --jq '{tag: .tagName, target: .targetCommitish, body_head: (.body | split("\n")[0]), assets: [.assets[] | {name: .name, size: .size}]}'
          echo "--- re-download published arm64 asset and re-check sha256 ---"
          gh release download "v${VERSION}" -p "zhulong-${VERSION}-arm64-debug.apk" -D /tmp/recheck --repo lvsehuiyicm/TV
          sha256sum "/tmp/recheck/zhulong-${VERSION}-arm64-debug.apk"
          echo "artifact sha256: $ARTIFACT_SHA256"
          echo "$ARTIFACT_SHA256  /tmp/recheck/zhulong-${VERSION}-arm64-debug.apk" | sha256sum -c -
          echo "PUBLISH VERIFIED: published asset sha256 matches the built APK"
